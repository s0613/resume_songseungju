limit_req_zone $binary_remote_addr zone=resume_api_per_ip:10m rate=5r/s;

map $http_upgrade $resume_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # ALB health checks commonly use a private-IP Host header. Unknown hosts may
    # reach only liveness; every application path is dropped.
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host songseungju.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Vercel-Forwarded-For "";
        proxy_set_header X-Forwarded-Host songseungju.dev;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name songseungju.dev www.songseungju.dev 13.124.92.93;
    server_tokens off;

    # TLS is intentionally not configured with placeholder certificates.
    # Vercel serves its deployment with managed TLS. For EC2, terminate TLS at a
    # provisioned ALB (and restrict port 80 to that ALB) or install a valid
    # certificate here before adding a 443 listener or an HTTPS redirect.
    # HSTS is ignored on direct HTTP responses, but is effective when this
    # response reaches the browser through a trusted TLS-terminating ALB.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://www.gstatic.com; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; frame-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-XSS-Protection "0" always;

    # Next.js emits the same headers for Vercel/direct operation. Hide the
    # upstream copies here so EC2 responses contain one effective policy.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header X-Powered-By;

    access_log /var/log/nginx/resume_access.log;
    error_log /var/log/nginx/resume_error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    client_max_body_size 1m;
    client_body_timeout 15s;
    send_timeout 30s;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $resume_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Never append the client-supplied X-Forwarded-For value.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Vercel-Forwarded-For "";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Behind an ALB, $remote_addr is intentionally the ALB until the exact VPC
    # subnet CIDRs are trusted with set_real_ip_from/real_ip_header. Configure
    # those at the nginx http level before rate-limiting on end-user IPs. Never
    # trust X-Forwarded-For from arbitrary addresses. If the ALB terminates TLS,
    # also forward its X-Forwarded-Proto only after direct access is blocked.

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        # Next.js supplies the immutable cache policy. No location add_header is
        # used, so all server-level security headers remain inherited.
    }

    location ~* \.(ico|css|js|gif|jpe?g|png|svg|webp|avif|woff2?|ttf|eot|glb|gltf)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        # Keep this location free of add_header directives; nginx otherwise
        # drops every server-level security header through inheritance rules.
    }

    # ^~ prevents a path such as /api/example.css from escaping into the
    # extension-based static-file regex location below.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        client_max_body_size 64k;
        client_body_timeout 10s;
        limit_req zone=resume_api_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000/robots.txt;
        access_log off;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000/sitemap.xml;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
